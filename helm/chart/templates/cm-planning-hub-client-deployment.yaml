apiVersion: apps/v1
kind: Deployment
metadata:
  name: cm-planning-hub-client-deployment
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cm-planning-hub-client
  template:
    metadata:
      labels:
        app: cm-planning-hub-client
    spec:
      containers:
        - name: cm-planning-hub-client
          image: {{ .Values.registry }}/{{ .Values.client_image }}:{{ .Values.tag }}
          ports:
            - containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: http://cm-planning-hub-server-service:80
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
