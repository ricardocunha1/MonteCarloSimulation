apiVersion: apps/v1
kind: Deployment
metadata:
  name: cm-planning-hub-server-deployment
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cm-planning-hub-server
  template:
    metadata:
      labels:
        app: cm-planning-hub-server
    spec:
      containers:
        - name: cm-planning-hub-server
          image: {{ .Values.registry }}/{{ .Values.server_image }}:{{ .Values.tag }}
          ports:
            - containerPort: 8000
          env:
            - name: ADO_ALLOWED_HOSTS
              value: {{ .Values.adoAllowedHosts | quote }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
