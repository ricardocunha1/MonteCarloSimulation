apiVersion: apps/v1
kind: Deployment
metadata:
  name: monte-carlo-sim-server-deployment
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monte-carlo-sim-server
  template:
    metadata:
      labels:
        app: monte-carlo-sim-server
    spec:
      containers:
        - name: monte-carlo-sim-server
          image: {{ .Values.registry }}/{{ .Values.server_image }}:{{ .Values.tag }}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
