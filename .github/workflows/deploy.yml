name: "Deploy"
on: workflow_dispatch
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                fetch-depth: 0
                fetch-tags: true
            - name: Set up GitVersion
              uses: gittools/actions/gitversion/setup@v4.7.0
              with:
                versionSpec: '6.8.x'
            - name: Calculate version from GitVersion
              id: app_version
              uses: gittools/actions/gitversion/execute@v4.7.0
            - name: Get Image Tag
              id: image_tag
              run: echo "image_tag=${{ steps.app_version.outputs.major }}.${{ steps.app_version.outputs.minor }}.${{ steps.app_version.outputs.patch }}" >> "$GITHUB_OUTPUT"
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                python-version: '3.12'
                cache: pip
                cache-dependency-path: src/server/requirements.txt
            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                node-version: '22'
                cache: npm
                cache-dependency-path: src/client/package-lock.json
            - name: Test server
              run: |
                pip install -r src/server/requirements.txt
                pytest src/server
            - name: Test and build client
              working-directory: src/client
              run: |
                npm ci
                npm test -- --run
                npm run build
            - name: Build and push client and server images
              run: ./deploy/build-docker-image.sh -t ${{ steps.image_tag.outputs.image_tag }} -u ${{ secrets.CM_REPO_USERNAME }} -p ${{ secrets.CM_REPO_PAT }}
            - name: Apply Git Tag
              run: |
                git tag -a "${{ steps.image_tag.outputs.image_tag }}" -m "Release ${{ steps.image_tag.outputs.image_tag }}"
                git push origin "${{ steps.image_tag.outputs.image_tag }}"
