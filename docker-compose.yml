services:
  server:
    build: ./src/server
    image: estimationshub/estimationshub-server:local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  client:
    build: ./src/client
    image: estimationshub/estimationshub-client:local
    environment:
      API_UPSTREAM: http://server:8000
    ports:
      - "8080:8080"
    depends_on:
      server:
        condition: service_healthy
