{% extends "base.html" %}
{% from "_field_help.html" import info_icon %}

{% block title %}Monte Carlo Simulator – Data Input{% endblock %}

{% block content %}

{% include "_errors.html" %}

<form method="post" action="{{ url_for('main.validate') }}" enctype="multipart/form-data" class="space-y-6 max-w-xl mx-auto">

    <div>
        <label class="flex items-center gap-1 text-sm font-medium mb-1" for="sprint_history_file">
            Sprint History Data (Excel file) <span style="color: var(--cm-red);">*</span>
            {{ info_icon("An Excel file containing historical sprint data.") }}
        </label>
        <input class="block w-full text-sm text-slate-300 file:mr-4 file:rounded file:border-0 file:bg-slate-700 file:px-4 file:py-2 file:text-slate-100"
               type="file" id="sprint_history_file" name="sprint_history_file" accept=".xlsx" required>
    </div>

    <div>
        <label class="flex items-center gap-1 text-sm font-medium mb-1" for="target_type">
            Target Type <span style="color: var(--cm-red);">*</span>
            {{ info_icon('A choice between "Items Resolved" or "Story Points" to determine the metric for the simulation.') }}
        </label>
        <select class="w-full rounded bg-slate-800 border border-slate-700 px-3 py-2" id="target_type" name="target_type">
            <option value="Items Resolved" {% if values.target_type == "Items Resolved" %}selected{% endif %}>Items Resolved</option>
            <option value="Story Points" {% if values.target_type == "Story Points" %}selected{% endif %}>Story Points</option>
        </select>
    </div>

    <div>
        <label class="flex items-center gap-1 text-sm font-medium mb-1" for="target_value">
            Target Value <span style="color: var(--cm-red);">*</span>
            {{ info_icon("The target to be completed.") }}
        </label>
        <input class="w-full rounded bg-slate-800 border border-slate-700 px-3 py-2"
               type="number" step="any" id="target_value" name="target_value" value="{{ values.target_value }}" required>
    </div>

    <div>
        <label class="flex items-center gap-1 text-sm font-medium mb-1" for="num_simulations">
            Number of Simulations <span style="color: var(--cm-red);">*</span>
            {{ info_icon("Number of Monte Carlo simulations to run. Maximum of 20000 simulations.") }}
        </label>
        <input class="w-full rounded bg-slate-800 border border-slate-700 px-3 py-2"
               type="number" step="1" id="num_simulations" name="num_simulations" value="{{ values.num_simulations }}" required>
    </div>

    <div>
        <label class="flex items-center gap-1 text-sm font-medium mb-1" for="sprint_start_date">
            Sprint Start Date <span style="color: var(--cm-red);">*</span>
            {{ info_icon("The start date of the first sprint of the simulation.") }}
        </label>
        <input class="w-full rounded bg-slate-800 border border-slate-700 px-3 py-2"
               type="date" id="sprint_start_date" name="sprint_start_date" value="{{ values.sprint_start_date }}" required>
    </div>

    <div>
        <label class="flex items-center gap-1 text-sm font-medium mb-1" for="sprint_length">
            Sprint Length (business days) <span style="color: var(--cm-red);">*</span>
            {{ info_icon("The length of each sprint in business days.") }}
        </label>
        <input class="w-full rounded bg-slate-800 border border-slate-700 px-3 py-2"
               type="number" step="1" id="sprint_length" name="sprint_length" value="{{ values.sprint_length }}" required>
    </div>

    <div class="flex items-center gap-2">
        <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="skip_validation" name="skip_validation" class="sr-only peer" {% if values.skip_validation %}checked{% endif %}>
            <div class="w-11 h-6 rounded-full bg-slate-700 transition-colors peer-checked:bg-[var(--cm-light-blue)] peer-focus-visible:ring-2 peer-focus-visible:ring-offset-2 peer-focus-visible:ring-offset-slate-950 peer-focus-visible:ring-[var(--cm-light-blue)]"></div>
            <div class="absolute left-1 top-1 h-4 w-4 rounded-full bg-white transition-transform peer-checked:translate-x-5"></div>
        </label>
        <label class="flex items-center gap-1" for="skip_validation">
            Skip Historical Sprint Validation
            {{ info_icon("Skip the historical sprint validation step and proceed without validation.") }}
        </label>
    </div>

    <div>
        <label class="flex items-center gap-1 text-sm font-medium mb-1" for="exclude_latest_sprints">
            Exclude Latest Sprints from Sampling
            {{ info_icon("The number of latest sprints to exclude from sampling.") }}
        </label>
        <input class="w-full rounded bg-slate-800 border border-slate-700 px-3 py-2"
               type="number" step="1" min="0" id="exclude_latest_sprints" name="exclude_latest_sprints" value="{{ values.exclude_latest_sprints }}">
    </div>

    <div>
        <label class="flex items-center gap-1 text-sm font-medium mb-1" for="team_capacity_factor">
            Team Capacity Factor
            {{ info_icon('The team capacity factor relative to the historical data. 1.0 means same capacity, 1.2 means 20% additional capacity. Multiplies Items Resolved and Story Points when running the simulation.') }}
        </label>
        <input class="w-full rounded bg-slate-800 border border-slate-700 px-3 py-2"
               type="number" step="0.01" min="0.01" id="team_capacity_factor" name="team_capacity_factor" value="{{ values.team_capacity_factor }}">
    </div>

    <div class="flex justify-end">
        <button type="submit" class="rounded px-4 py-2 font-medium" style="background-color: var(--cm-light-blue); color: #04101d;">
            Continue
        </button>
    </div>
</form>
{% endblock %}
